<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date method</title>
</head>

<body>
    <script>
        //JS have inbuilt date objects and it has its on useful methods.
        const date = new Date()
        document.write(date + "<br>")
        //to get full year  
        document.write(`${date.getFullYear()}<br>`)
        //to get month
        document.write(`${date.getMonth() + 1}<br>`)

        //to get hours
        document.write(`${date.getHours()}<br>`)

        //to get weekdays
        document.write(`${date.getDay() + 1}<br>`)

        //write a program to display yyyy / dd / mm
        const year = date.getFullYear()
        const month = date.getMonth()
        const montharr = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec']
        const todayDate = date.getDate()
        const day = date.getDay()
        const weekDays = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday']
        document.write(`${year}/${montharr[month]}/${todayDate}/ ${weekDays[day]}<br>`)


        //to get hours
        document.write(`${date.getHours()}<br>`)
        //to get minutes
        document.write(`${date.getMinutes()}<br>`)
        //to get seconds
        document.write(`${date.getSeconds()}<br>`)
        //to get milliseconds
        document.write(`${date.getMilliseconds()}<br>`)
        // 
        //to get time()
        document.write(`${date.getTime()}<br>`)

        // to get time in hh/mm/ss
        document.write(`${date.getHours()}/${date.getMinutes()}/${date.getSeconds()}/ ${date.getMilliseconds()}<br>`)
        // timing events in JS
        //SetTimeOut
        console.log(`countdown 1 started`)
        setTimeout(() => console.log(`countdown 2 started`), 5000)
        console.log(`countdown 3 started`)
        console.log(`countdown 4 started`)

        //setInterval
        setInterval(() => console.log("Hello diya"), 5000)

    </script>
</body>

</html>
