<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //Math method are in built methods in javascript that helps developer to performs mathematical operations.
        //Math.floor-> nearest intiger less than or equal to the given number.
        document.write(Math.floor(5.99))//5

        //Math.ceil
        document.write(Math.ceil(5.01)) //6

        //Math.round
        document.write(Math.round(5.5))//6
        document.write(Math.round(5.1))//5

        //Math.trunc-> removes decimal part. 
        document.write(Math.trunc(10.77))//10

        //Math.random-> Returns random floating point number between 0 and 1
        let rand = Math.random()
        document.write(`${rand}<br>`)// 0 to 1

        //.toFixed()
        document.write(`${rand.toFixed(4)} <br>`)

        //Math.max
        document.write(`${Math.max(4, 5, 7, 9)}<br>`)

        //Math.min
        document.write(`${Math.min(4, 5, 7, 9, 1)}<br>`)

        //math.PI
        document.write(`${Math.PI}<br>`)

        //Math.pow()
        document.write(`${Math.pow(2, 3)}<br>`)//8

        //Math.sqrt()
        document.write(`${Math.sqrt(25)}<br>`)

        //Generate random no. 1 to 6
        let rand1to6 = (Math.random() * 6) + 1
        console.log(rand1to6)
        //  //Generate random no. 1 to 7 using Math.trunc
        let rand1to7 = Math.trunc((Math.random() * 6) + 1)
        console.log(rand1to7)






    </script>
</body>

</html>
